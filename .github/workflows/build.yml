name: Build Mod

on:
  push:
    tags:
      - 'v*'
  # so a build can be proven green before a tag is cut, not after
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-windows-gnu
            artifact: zig_demo_mod.dll
            platform: windows
          - os: macos-14
            target: x86_64-macos
            artifact: libzig_demo_mod.dylib
            output: zig_demo_mod.dylib
            platform: macos-x64
          - os: macos-14
            target: aarch64-macos
            artifact: libzig_demo_mod.dylib
            output: zig_demo_mod-arm64.dylib
            platform: macos-arm64
          - os: ubuntu-latest
            target: x86_64-linux
            artifact: libzig_demo_mod.so
            output: zig_demo_mod.so
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Fetch client import library (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          # Windows mods must link the client's import library; a DLL with
          # unresolved client symbols crashes the game on the first API call.
          curl -fsSL -o mod-sdk.zip \
            "https://github.com/eddoww/astonia_community_client/releases/download/v1.2.39/mod-sdk.zip"
          unzip -oq mod-sdk.zip
          mkdir -p lib
          cp mod-sdk/lib/moac.a mod-sdk/lib/moac.lib lib/

      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

      - name: Rename artifact (Unix)
        if: matrix.platform != 'windows'
        run: cp zig-out/lib/${{ matrix.artifact }} ${{ matrix.output }}

      - name: Rename artifact (Windows)
        if: matrix.platform == 'windows'
        run: cp zig-out/bin/${{ matrix.artifact }} ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: ${{ matrix.output || matrix.artifact }}

  create-universal-macos:
    needs: build
    runs-on: macos-14
    steps:
      - name: Download x64
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
          path: x64

      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: arm64

      - name: Create Universal Binary
        run: |
          lipo -create x64/zig_demo_mod.dylib arm64/zig_demo_mod-arm64.dylib -output zig_demo_mod.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: zig_demo_mod.dylib

  release:
    needs: [build, create-universal-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release files
        run: |
          mkdir -p release
          cp artifacts/windows/zig_demo_mod.dll release/
          cp artifacts/macos/zig_demo_mod.dylib release/
          cp artifacts/linux/zig_demo_mod.so release/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/zig_demo_mod.dll
            release/zig_demo_mod.dylib
            release/zig_demo_mod.so
          generate_release_notes: true
